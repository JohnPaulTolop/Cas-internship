name: practicum_connect
description: Role-based internship management app converted from the Practicum Connect PHP prototype.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.10.0
  file_picker: ^13.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  intl: ^0.20.2
  pdf: ^3.13.1
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
